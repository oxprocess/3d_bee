<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>derbeebee 形态实验台</title>
<meta name="description" content="derbeebee 形态实验台：换珍珠、落一件事、挖到最深、打开接口透视，所有模块一起试。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* derbeebee 设计令牌与组件样式。页面只需引入这一个文件。 */
:root {
  --dbb-mist-1: #ECE3F3;
  --dbb-mist-2: #F7F3FA;
  --dbb-scene-bg: #F3EDF7;
  --dbb-ink: #1E1A2E;
  --dbb-body: #565068;
  --dbb-soft: #8E86A0;
  --dbb-violet: #7B6BBE;
  --dbb-mint: #3F9A78;
  --dbb-mint-soft: rgba(79, 168, 134, 0.16);
  --dbb-line: rgba(123, 107, 190, 0.22);
  --dbb-card: rgba(255, 255, 255, 0.74);
  --dbb-card-solid: #FFFFFF;
  --dbb-shadow: 0 10px 30px rgba(80, 64, 140, 0.1);
  --dbb-brand: linear-gradient(92deg, #3D7BD6 0%, #8B7BC7 52%, #C2566E 100%);
  --dbb-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --dbb-sans: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --dbb-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  --dbb-work: #F1D2A6;
  --dbb-family: #EFC3CF;
  --dbb-health: #BFE6D6;
  --dbb-friends: #BFD5F2;
  --dbb-radius: 16px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --dbb-mist-1: #1B1726;
    --dbb-mist-2: #13111A;
    --dbb-scene-bg: #16131F;
    --dbb-ink: #EEE9F6;
    --dbb-body: #C6BFD8;
    --dbb-soft: #928AA8;
    --dbb-violet: #AEA0EE;
    --dbb-mint: #7FD1B0;
    --dbb-mint-soft: rgba(127, 209, 176, 0.16);
    --dbb-line: rgba(174, 160, 238, 0.22);
    --dbb-card: rgba(36, 31, 50, 0.76);
    --dbb-card-solid: #231E31;
    --dbb-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --dbb-mist-1: #1B1726;
  --dbb-mist-2: #13111A;
  --dbb-scene-bg: #16131F;
  --dbb-ink: #EEE9F6;
  --dbb-body: #C6BFD8;
  --dbb-soft: #928AA8;
  --dbb-violet: #AEA0EE;
  --dbb-mint: #7FD1B0;
  --dbb-mint-soft: rgba(127, 209, 176, 0.16);
  --dbb-line: rgba(174, 160, 238, 0.22);
  --dbb-card: rgba(36, 31, 50, 0.76);
  --dbb-card-solid: #231E31;
  --dbb-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

/* 组件里用 hidden 属性开关显示；这条保证它不被 display 规则盖掉 */
[hidden] { display: none !important; }

/* ── 色彩方向：两个深色方向在舞台里用自己的夜色，不管页面是浅色还是深色 ── */
.dbb-stage[data-look="aurora"] {
  color-scheme: dark;
  --dbb-scene-bg: #0B0A1C;
  --dbb-ink: #EEE9F6; --dbb-body: #C6BFD8; --dbb-soft: #9A92B0; --dbb-violet: #B9A6FF; --dbb-mint: #7FE3D2;
  --dbb-line: rgba(185, 166, 255, 0.24); --dbb-card: rgba(26, 22, 52, 0.72); --dbb-card-solid: #1A1634;
  background: radial-gradient(ellipse 70% 55% at 50% 38%, #1D1845 0%, #0E0C24 55%, #07060F 100%);
}
.dbb-stage[data-look="expanse"] {
  color-scheme: dark;
  --dbb-scene-bg: #0A0F14;
  --dbb-ink: #E6EDF1; --dbb-body: #B7C3CA; --dbb-soft: #7F8E98; --dbb-violet: #E8A33D; --dbb-mint: #3FC1C9;
  --dbb-line: rgba(63, 193, 201, 0.22); --dbb-card: rgba(12, 20, 26, 0.78); --dbb-card-solid: #0F171D;
  --dbb-serif: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  background: linear-gradient(180deg, #05070A 0%, #0A0F14 58%, #10171E 100%);
}
.dbb-stage[data-look="expanse"] .dbb-dir,
.dbb-stage[data-look="expanse"] .dbb-caption { font-family: var(--dbb-mono); letter-spacing: 0.02em; border-radius: 4px; }

/* ── 3D 舞台 ── */
.dbb-stage {
  position: relative;
  overflow: hidden;
  outline: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.dbb-stage:focus-visible { box-shadow: inset 0 0 0 2px var(--dbb-violet); border-radius: var(--dbb-radius); }
.dbb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.dbb-canvas:active { cursor: grabbing; }
.dbb-overlay { position: absolute; inset: 0; pointer-events: none; }
.dbb-overlay > * { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.35s; will-change: transform; }
.dbb-dir {
  translate: -50% -50%;
  display: flex; align-items: center; gap: 6px;
  font: 500 12px/1 var(--dbb-sans); color: var(--dbb-body);
  background: var(--dbb-card); padding: 5px 9px; border-radius: 999px;
  box-shadow: 0 0 0 1px var(--dbb-line) inset;
  white-space: nowrap;
}
.dbb-dir i { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9); }
.dbb-prob {
  translate: 10px -50%;
  font: 13px/1.35 var(--dbb-sans); color: var(--dbb-ink);
  white-space: nowrap; display: grid; gap: 1px;
}
.dbb-prob b { font: 500 12px/1 var(--dbb-sans); color: var(--dbb-violet); margin-right: 6px; }
.dbb-prob-shadow b { color: var(--dbb-mint); }
.dbb-prob small { font-size: 11px; color: var(--dbb-soft); }
.dbb-count {
  translate: -50% -50%;
  font: 700 30px/1 var(--dbb-serif); color: var(--dbb-ink);
  text-shadow: 0 0 14px var(--dbb-scene-bg), 0 0 4px var(--dbb-scene-bg);
}
.dbb-caption {
  position: absolute; left: 50%; bottom: 14px;
  transform: translate(-50%, 6px);
  width: max-content; max-width: min(92%, 34em);
  text-align: center; text-wrap: balance;
  font: 14px/1.6 var(--dbb-sans); color: var(--dbb-body);
  background: var(--dbb-card); padding: 8px 14px; border-radius: 12px;
  box-shadow: 0 0 0 1px var(--dbb-line) inset;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: 0; transition: opacity 0.4s, transform 0.4s; pointer-events: none;
}
.dbb-caption.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .dbb-overlay > *, .dbb-caption { transition: none; }
}

/* ── 组件 ── */
.dbb-el { display: block; }
.dbb-card {
  background: var(--dbb-card);
  border-radius: var(--dbb-radius);
  box-shadow: 0 0 0 1px var(--dbb-line) inset, var(--dbb-shadow);
  padding: 16px 18px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  color: var(--dbb-body);
  font: 14px/1.7 var(--dbb-sans);
}
.dbb-card h3 { margin: 2px 0 4px; font: 700 19px/1.35 var(--dbb-serif); color: var(--dbb-ink); text-wrap: balance; }
.dbb-card p { margin: 0; }
.dbb-card > * + * { margin-top: 8px; }
.dbb-card > h3 { margin-top: 4px; }
.dbb-eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; letter-spacing: 0.06em; color: var(--dbb-violet); }
.dbb-card .dbb-gen { font: 700 30px/1.1 var(--dbb-serif); }
.dbb-gen span { margin-left: 8px; font: 400 13px var(--dbb-sans); letter-spacing: 0; color: var(--dbb-soft); }
.dbb-when { font-size: 13px; color: var(--dbb-soft); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dbb-learned { font: 500 16px/1.6 var(--dbb-serif); color: var(--dbb-ink); text-wrap: pretty; }
.dbb-kv { font-size: 13px; }
.dbb-kv em { font-style: normal; color: var(--dbb-ink); font-variant-numeric: tabular-nums; }
.dbb-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 0 8px 0 6px; border-radius: 999px;
  font-size: 12px; line-height: 20px; color: var(--dbb-ink);
  background: color-mix(in srgb, var(--dbb-card-solid) 72%, transparent);
  box-shadow: 0 0 0 1px var(--dbb-line) inset;
}
.dbb-chip i { width: 8px; height: 8px; border-radius: 50%; }
.dbb-pill { font-size: 11px; letter-spacing: 0; padding: 0 8px; line-height: 18px; border-radius: 999px; border: 1px solid var(--dbb-line); color: var(--dbb-body); }
.dbb-pill.mint { color: var(--dbb-mint); border-color: color-mix(in srgb, var(--dbb-mint) 40%, transparent); background: var(--dbb-mint-soft); }
.dbb-pill.ok { color: #fff; background: var(--dbb-mint); border-color: transparent; }
.dbb-retired { font-size: 12px; color: var(--dbb-soft); border-top: 1px dashed var(--dbb-line); padding-top: 8px; }

.dbb-ticks { display: flex; align-items: flex-end; gap: 2px; height: 42px; }
.dbb-tick { flex: 1 1 0; min-width: 2px; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: flex-end; border-radius: 2px; }
.dbb-tick i { display: block; width: 100%; border-radius: 2px; background: var(--dbb-soft); opacity: 0.5; transition: opacity 0.2s; }
.dbb-tick.w-s i { background: var(--dbb-mint); }
.dbb-tick.w-b i { background: var(--dbb-violet); }
.dbb-tick:hover i, .dbb-tick.on i { opacity: 1; }
.dbb-tick.on i { box-shadow: 0 0 0 1.5px var(--dbb-card-solid), 0 0 0 3px var(--dbb-ink); }
.dbb-tick-detail { font-size: 12px; line-height: 1.6; color: var(--dbb-body); min-height: 3.3em; }
.dbb-tick-detail b { color: var(--dbb-ink); font-weight: 500; }

.dbb-slots { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 4px; }
.dbb-slots i { aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 1px var(--dbb-line) inset; }
.dbb-slots i.w-s { background: var(--dbb-mint); box-shadow: none; }
.dbb-slots i.w-b { background: color-mix(in srgb, var(--dbb-violet) 60%, transparent); box-shadow: none; }
.dbb-slots i.w-t { background: var(--dbb-soft); box-shadow: none; }
.dbb-rule { font-size: 12px; color: var(--dbb-soft); }
.dbb-rule.ok { color: var(--dbb-mint); }

.dbb-stamp { font-size: 11px; letter-spacing: 0; color: var(--dbb-ink); border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; opacity: 0.72; transform: rotate(-2deg); }
.dbb-card .dbb-q { font-size: 18px; }
.dbb-bars { display: grid; gap: 6px; }
.dbb-bar { display: grid; grid-template-columns: 2.6em 1fr 3em; align-items: center; gap: 8px; font-size: 13px; }
.dbb-bar i { height: 6px; border-radius: 6px; background: var(--dbb-line); overflow: hidden; }
.dbb-bar i b { display: block; height: 100%; border-radius: 6px; background: var(--dbb-violet); }
.dbb-bar.shadow i b { background: var(--dbb-mint); }
.dbb-bar em { font-style: normal; text-align: right; color: var(--dbb-ink); font-variant-numeric: tabular-nums; }
.dbb-note { font-size: 11px; color: var(--dbb-soft); }
.dbb-sub { font-size: 12px; color: var(--dbb-violet); }
.dbb-prep ul { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
.dbb-prep li::before { content: "✓"; color: var(--dbb-mint); margin-right: 6px; }
.dbb-status { font-size: 13px; color: var(--dbb-ink); }
.dbb-status.ok::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dbb-mint); margin-right: 6px; vertical-align: 1px; }

.dbb-rail { display: flex; flex-direction: column; gap: 2px; }
.dbb-rail button {
  display: flex; align-items: center; gap: 10px; border: 0; background: none;
  padding: 5px 10px 5px 6px; border-radius: 10px; cursor: pointer;
  font: 13px/1.2 var(--dbb-sans); color: var(--dbb-soft); text-align: left; white-space: nowrap;
}
.dbb-rail button i {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff, #E6D6EE 45%, #B9B2E6);
  box-shadow: 0 0 0 1px var(--dbb-line); transition: transform 0.25s;
}
.dbb-rail button.past i { opacity: 0.45; }
.dbb-rail button.on { color: var(--dbb-ink); background: var(--dbb-card); box-shadow: 0 0 0 1px var(--dbb-line) inset; }
.dbb-rail button.on i { transform: scale(1.45); box-shadow: 0 0 0 1px var(--dbb-violet), 0 0 12px rgba(139, 123, 199, 0.55); }
.dbb-rail button:hover { color: var(--dbb-ink); }

.dbb-timeline { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 14px; }
.dbb-tl-track { position: relative; height: 44px; margin: 0 14px; }
.dbb-tl-line { position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--dbb-line); border-radius: 2px; }
.dbb-tl-dot { position: absolute; top: 4px; translate: -50% 0; border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 5px; font: 11px/1 var(--dbb-sans); color: var(--dbb-soft); white-space: nowrap; }
.dbb-tl-dot i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--dbb-card-solid), 0 0 0 3px var(--dbb-line); transition: transform 0.2s; }
.dbb-tl-dot.on i { transform: scale(1.3); box-shadow: 0 0 0 2px var(--dbb-card-solid), 0 0 0 3.5px var(--dbb-ink); }
.dbb-tl-dot.on span { color: var(--dbb-ink); }
.dbb-tl-dot.later i { opacity: 0.35; }
.dbb-tl-now { display: flex; align-items: center; gap: 8px; padding-top: 3px; }
.dbb-tl-now i { width: 44px; height: 2px; background: linear-gradient(90deg, var(--dbb-mint) var(--p), transparent var(--p)), repeating-linear-gradient(90deg, color-mix(in srgb, var(--dbb-mint) 55%, transparent) 0 4px, transparent 4px 7px); }
.dbb-tl-now button { border: 0; background: none; padding: 2px 0; cursor: pointer; font: 12px var(--dbb-sans); color: var(--dbb-mint); white-space: nowrap; }
.dbb-tl-now.on button { font-weight: 600; }

.dbb-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.dbb-log li { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; font-size: 13px; }
.dbb-log time { color: var(--dbb-soft); font-variant-numeric: tabular-nums; font-size: 12px; }
.dbb-log-tag { color: var(--dbb-violet); font-size: 12px; }
.dbb-log p { grid-column: 1 / -1; margin: 2px 0 0; color: var(--dbb-body); }
.dbb-log-empty { color: var(--dbb-soft); }

dbb-data-lens { position: absolute; inset: 0; pointer-events: none; z-index: 3; display: none; }
dbb-data-lens[on] { display: block; }
.dbb-lens-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dbb-lens-lines path { fill: none; stroke: var(--dbb-violet); stroke-width: 1; opacity: 0.55; }
.dbb-lens-lines circle { fill: var(--dbb-card-solid); stroke: var(--dbb-violet); stroke-width: 1.5; }
.dbb-lens-item {
  position: absolute; left: 0; top: 0; display: grid; gap: 1px; padding: 5px 9px 6px; border-radius: 10px;
  background: var(--dbb-card); box-shadow: 0 0 0 1px var(--dbb-line) inset;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font: 11px/1.35 var(--dbb-sans); color: var(--dbb-body);
}
.dbb-lens-item p { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dbb-lens-item b { font: 600 12px/1.3 var(--dbb-sans); color: var(--dbb-ink); }
.dbb-lens-item em { font-style: normal; color: var(--dbb-mint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dbb-lens-item code { font: 10.5px/1.3 var(--dbb-mono); color: var(--dbb-violet); overflow-wrap: anywhere; }
@media (max-width: 560px) { .dbb-lens-item code { font-size: 9.5px; } }
@media (prefers-reduced-motion: reduce) { .dbb-rail button i, .dbb-tl-dot i, .dbb-tick i { transition: none; } }

/* 色彩方向的小样 */
.dbb-sw { width: 30px; height: 30px; border-radius: 50%; display: block; flex: none; }
.dbb-sw-lit { background: radial-gradient(circle at 36% 32%, #fff 0 12%, #F2DDE6 34%, #D9CFEF 62%, #B9B2E6 100%); box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #9FDCC6; }
.dbb-sw-aurora { background: radial-gradient(circle at 40% 36%, #F4F0FF 0 16%, #7E78B8 60%, #2A2358 100%); box-shadow: 0 0 10px 1px #8D5BFF, 0 0 0 2px #FF5EB8; }
.dbb-sw-expanse { background: radial-gradient(circle at 26% 34%, #FFF1DC 0 6%, #CDB597 20%, #6B5B48 48%, #0B0F14 70%); box-shadow: 0 0 0 1.5px #3FC1C9; }
</style>
<style>
/* 实验台：左边选珍珠和深度，中间是它，右边是全部模块。 */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.7 var(--dbb-sans);
  color: var(--dbb-body);
  background: linear-gradient(180deg, var(--dbb-mist-1), var(--dbb-mist-2) 50%, var(--dbb-mist-1));
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
}
h1, h2 { margin: 0; }
button, select { font: inherit; color: inherit; }
kbd { font: 11px var(--dbb-mono); padding: 0 5px; border-radius: 4px; box-shadow: 0 0 0 1px var(--dbb-line) inset; background: var(--dbb-card); color: var(--dbb-ink); margin-right: 3px; }
:focus-visible { outline: 2px solid var(--dbb-violet); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.bar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: calc(10px + env(safe-area-inset-top, 0px)) clamp(16px, 2vw, 28px) 10px;
  border-bottom: 1px solid var(--dbb-line);
}
.wordmark { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.14em; color: var(--dbb-violet); font-size: 15px; }
.bar h1 { font: 700 18px var(--dbb-serif); color: var(--dbb-ink); }
.bar-nav { display: flex; gap: 4px; font-size: 13px; }
.bar-nav a { text-decoration: none; color: var(--dbb-body); padding: 3px 10px; border-radius: 999px; }
.bar-nav a[aria-current] { color: var(--dbb-ink); background: var(--dbb-card); box-shadow: 0 0 0 1px var(--dbb-line) inset; }
.bar-actions { margin-left: auto; display: flex; gap: 6px; }
.ghost { border: 0; cursor: pointer; font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--dbb-card); color: var(--dbb-body); box-shadow: 0 0 0 1px var(--dbb-line) inset; }
.ghost:hover { color: var(--dbb-ink); }
.ghost[aria-pressed="true"] { color: #fff; background: var(--dbb-violet); box-shadow: none; }

.lab {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 340px;
  gap: 0;
  min-height: 0;
}
.left, .right { overflow-y: auto; min-height: 0; padding: 16px clamp(12px, 1.4vw, 20px); display: grid; align-content: start; gap: 22px; }
.right { gap: 12px; border-left: 1px solid var(--dbb-line); }
.left { border-right: 1px solid var(--dbb-line); }
.cap { font: 500 12px var(--dbb-sans); letter-spacing: 0.06em; color: var(--dbb-violet); margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.cap span { letter-spacing: 0; color: var(--dbb-soft); font-weight: 400; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.picks button {
  display: grid; justify-items: center; gap: 0; padding: 8px 4px 9px; border: 0; border-radius: 12px; cursor: pointer;
  background: transparent; text-align: center; transition: background 0.2s;
}
.picks button:hover, .picks button[aria-pressed="true"] { background: var(--dbb-card); box-shadow: 0 0 0 1px var(--dbb-line) inset; }
.picks b { font: 700 14px var(--dbb-serif); color: var(--dbb-ink); }
.picks small { font-size: 11px; color: var(--dbb-soft); line-height: 1.4; }
.looks { display: grid; gap: 4px; }
.looks button {
  display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center;
  padding: 7px 8px; border: 0; border-radius: 12px; cursor: pointer; background: transparent; text-align: left;
}
.looks button:hover, .looks button[aria-pressed="true"] { background: var(--dbb-card); box-shadow: 0 0 0 1px var(--dbb-line) inset; }
.looks b { font: 700 13px/1.3 var(--dbb-serif); color: var(--dbb-ink); }
.looks small { grid-column: 2; font-size: 11px; line-height: 1.35; color: var(--dbb-soft); }
.looks .dbb-sw { grid-row: 1 / span 2; }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12px; color: var(--dbb-soft); }
.legend b { color: var(--dbb-ink); font-weight: 500; margin-right: 4px; }

.center { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; min-height: 0; padding: 0 clamp(12px, 1.6vw, 24px) 12px; gap: 6px; }
.stage-box { position: relative; min-height: 320px; }
#stage { position: absolute; inset: 0; }
.stage-note { position: absolute; right: 8px; top: 10px; z-index: 4; font-size: 11px; color: var(--dbb-soft); margin: 0; }
.events { display: grid; gap: 8px; }
.events .cap { margin: 0; }
.ev-row { display: flex; flex-wrap: wrap; gap: 6px; }
.ev-row button {
  display: inline-flex; align-items: baseline; gap: 6px; border: 0; cursor: pointer;
  padding: 7px 12px; border-radius: 12px; font-size: 13px; color: var(--dbb-ink);
  background: var(--dbb-card); box-shadow: 0 0 0 1px var(--dbb-line) inset;
  transition: background 0.2s, opacity 0.2s;
}
.ev-row button em { font-style: normal; font-size: 11px; color: var(--dbb-violet); }
.ev-row button:hover:not(:disabled) { background: var(--dbb-card-solid); }
.ev-row button:disabled { opacity: 0.45; cursor: default; }
.ev-row.secondary button { font-size: 12px; color: var(--dbb-body); padding: 5px 10px; }
.ev-row .iter.ready { color: #fff; background: var(--dbb-mint); box-shadow: 0 0 0 4px var(--dbb-mint-soft); }
.ev-row .iter.ready em { color: rgba(255, 255, 255, 0.85); }
.seal-group { display: inline-flex; gap: 0; }
.seal-group button { border-radius: 12px 0 0 12px; }
.seal-group select {
  border: 0; border-radius: 0 12px 12px 0; padding: 0 8px; font-size: 12px; cursor: pointer;
  background: var(--dbb-card); color: var(--dbb-ink); box-shadow: 0 0 0 1px var(--dbb-line) inset;
}
.log-card { max-height: 360px; overflow-y: auto; }

@media (max-width: 1180px) {
  .lab { grid-template-columns: 210px minmax(0, 1fr); }
  .right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--dbb-line); grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; overflow: visible; }
  body { height: auto; }
  html { height: auto; }
  .center { min-height: 78vh; }
}
@media (max-width: 760px) {
  .lab { grid-template-columns: minmax(0, 1fr); }
  .left { order: 2; border-right: 0; border-top: 1px solid var(--dbb-line); }
  .center { order: 1; min-height: 0; grid-template-rows: auto auto auto; }
  .stage-box { height: 56vh; height: 56svh; min-height: 300px; }
  .right { order: 3; grid-template-columns: 1fr; }
  .picks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bar h1 { font-size: 16px; }
  .bar-actions { margin-left: 0; }
}
</style>
</head>
<body>
<header class="bar">
  <span class="wordmark">derbeebee</span>
  <h1>形态实验台</h1>
  <nav class="bar-nav" aria-label="页面">
    <a href="./index.html" data-walk-link>形态走查</a>
    <a href="./lab.html" aria-current="page">实验台</a>
  </nav>
  <div class="bar-actions">
    <button type="button" id="lensBtn" class="ghost" aria-pressed="false">接口透视</button>
    <button type="button" id="theme" class="ghost">跟随系统</button>
  </div>
</header>

<div class="lab">
  <aside class="left" aria-label="选一颗珍珠与挖掘深度">
    <section>
      <h2 class="cap">选一颗珍珠</h2>
      <div class="picks" id="picks" role="group" aria-label="选一颗珍珠">
        <button type="button" data-ledger="story"><span class="g"></span><b>爸妈出游</b><small>差一次就满 30 次</small></button>
        <button type="button" data-ledger="birth"><span class="g"></span><b>诞生</b><small>还没有历史</small></button>
        <button type="button" data-ledger="wide"><span class="g"></span><b>宽展</b><small>铺得开</small></button>
        <button type="button" data-ledger="tight"><span class="g"></span><b>收束</b><small>圆而密</small></button>
        <button type="button" data-ledger="lean"><span class="g"></span><b>偏展</b><small>朝一侧长</small></button>
        <button type="button" data-ledger="turn"><span class="g"></span><b>转向</b><small>外圈偏了</small></button>
      </div>
    </section>
    <section>
      <h2 class="cap">色彩方向</h2>
      <div class="looks" id="looks" role="group" aria-label="色彩方向">
        <button type="button" data-look="lit" aria-pressed="true"><i class="dbb-sw dbb-sw-lit"></i><b>被经历点亮</b><small>推荐 · 极光只在事情发生时出现</small></button>
        <button type="button" data-look="aurora" aria-pressed="false"><i class="dbb-sw dbb-sw-aurora"></i><b>Apple Intelligence 式</b><small>常亮的光谱辉光</small></button>
        <button type="button" data-look="expanse" aria-pressed="false"><i class="dbb-sw dbb-sw-expanse"></i><b>The Expanse 式</b><small>硬光、陶瓷、仪表</small></button>
      </div>
    </section>
    <section>
      <h2 class="cap">挖掘深度</h2>
      <dbb-depth-rail id="rail"></dbb-depth-rail>
    </section>
    <section class="legend">
      <h2 class="cap">怎么碰它</h2>
      <ul>
        <li><b>拖动</b>转动（剖开后：左右转、上下俯仰）</li>
        <li><b>滚轮 / 双指</b>挖深、退回</li>
        <li><b>点剖面</b>选一代；再点，选一条细纹</li>
        <li><b>点水面</b>看倒影；<b>点水滴</b>看预判</li>
        <li><b>长按</b>数一数 · <b>双击</b>复位</li>
        <li><kbd>←</kbd><kbd>→</kbd><kbd>+</kbd><kbd>−</kbd><kbd>Enter</kbd><kbd>C</kbd><kbd>Esc</kbd></li>
      </ul>
    </section>
  </aside>

  <main class="center">
    <div class="stage-box">
      <div id="stage"></div>
      <p class="stage-note">示意 · 演示数据</p>
    </div>
    <dbb-timeline id="timeline"></dbb-timeline>
    <section class="events" aria-label="让一件事发生">
      <h2 class="cap">让一件事发生 <span>每一次点击，都是账本上的一行</span></h2>
      <div class="ev-row">
        <button type="button" data-ev="observe"><em>对话</em>说一句近况</button>
        <div class="seal-group">
          <button type="button" data-ev="seal"><em>预测</em>封存一个预判</button>
          <label class="sr-only" for="sealCat">预判的类别</label>
          <select id="sealCat" aria-label="预判的类别"></select>
        </div>
        <button type="button" data-ev="prepare"><em>准备</em>准备好</button>
        <button type="button" data-ev="yes"><em>成长</em>结果：发生了</button>
        <button type="button" data-ev="no"><em>成长</em>结果：没发生</button>
        <button type="button" data-ev="iterate" class="iter"><em>成长</em>迭代时刻</button>
      </div>
      <div class="ev-row secondary">
        <button type="button" data-ev="burst">再比较 10 次</button>
        <button type="button" data-ev="story">从 18:12 讲一遍故事</button>
        <button type="button" data-ev="count">数一数</button>
      </div>
    </section>
  </main>

  <aside class="right" aria-label="模块">
    <dbb-layer-card id="layerCard"></dbb-layer-card>
    <dbb-shadow-meter id="shadowMeter"></dbb-shadow-meter>
    <dbb-seal-card id="sealCard"></dbb-seal-card>
    <section class="dbb-card log-card">
      <p class="dbb-eyebrow">账本 · 只追加</p>
      <dbb-event-log id="log"></dbb-event-log>
    </section>
  </aside>
</div>
